<svg width="1200" height="820" viewBox="0 0 1200 820" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Clinical documentation workspace preview</title>
  <desc id="desc">A calm clinical AI dashboard with patient context, structured notes, and review signals.</desc>
  <defs>
    <linearGradient id="canvas" x1="72" y1="36" x2="1100" y2="788" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123B73"/>
      <stop offset="0.5" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="glow" x1="390" y1="92" x2="934" y2="714" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DFFCF1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#DFFCF1" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#061B3A" flood-opacity="0.3"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>
  <rect width="1200" height="820" rx="44" fill="url(#canvas)"/>
  <circle cx="925" cy="135" r="235" fill="#DFFCF1" fill-opacity="0.17" filter="url(#soft)"/>
